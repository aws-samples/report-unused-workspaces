version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      aws-sdk:
        patterns:
          - '@aws-sdk/*'
      aws-cdk:
        patterns:
          - 'aws-cdk'
          - 'aws-cdk-lib'
          - 'cdk-nag'
          - 'constructs'
      dev-tooling:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'typescript*'
          - 'jest'
          - 'ts-jest'
          - 'ts-node'
          - '@types/*'
          - 'esbuild'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
